# Manual release cut — the ONE workflow a human runs to ship a new CLI version.
#
# Actions → "release-cut" → Run workflow. Pick a bump (patch/minor/major) or an
# explicit version, and whether it's a pre-release.
#
# What it does, in order:
#   1. Guard   — refuse unless the e2e-kind workflow (ephemeral-kind
#                install/upgrade/uninstall e2e) passed on this SHA.
#   2. Version — compute the next SemVer from the latest tag.
#   3. Docs    — bump the README version reference, commit.
#   4. Gate    — wait for approval on the "production" Environment (the human
#                "ship to customers?" gate — configure required reviewers there).
#   5. Tag     — push vX.Y.Z. That tag triggers release.yml → GoReleaser, which
#                builds every OS/arch, signs, and publishes the GitHub Release
#                customers install from.
#
# Prod is promote-only: there is no prod test gate. The confidence that it's safe
# comes from the e2e-kind workflow having already install/upgrade/uninstall
# e2e-tested this exact SHA against an ephemeral kind cluster.

name: release-cut

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer bump (ignored if 'version' is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Explicit version, e.g. 1.4.0 (overrides bump; no leading v)"
        type: string
        default: ""
      prerelease:
        description: "Cut a pre-release (appends -rc.N; published as a GitHub pre-release)"
        type: boolean
        default: false

permissions:
  contents: write # commit README bump + push the tag

jobs:
  # --- 1) Only releasable commits get past here -------------------------------
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a green e2e-kind run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.sha }}"
          echo "Checking e2e-kind conclusion for $sha ..."
          concl="$(gh run list --workflow=e2e-kind.yml --branch=main \
                    --json headSha,conclusion,status \
                    --jq "[.[] | select(.headSha==\"$sha\")][0].conclusion" 2>/dev/null || echo '')"
          if [ "$concl" != "success" ]; then
            echo "::error::e2e-kind has not succeeded on $sha (got: '${concl:-none}')."
            echo "Merge to main and let the kind e2e suite pass before cutting a release,"
            echo "or run e2e-kind manually on this commit first."
            exit 1
          fi
          echo "e2e-kind passed on $sha — OK to release."

  # --- 2 & 3) Compute version, update docs, commit ----------------------------
  prepare:
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags + history for version math

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          latest="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          latest="${latest#v}"
          IFS=. read -r MA MI PA <<< "${latest%%-*}"
          if [ -n "${{ inputs.version }}" ]; then
            next="${{ inputs.version }}"
          else
            case "${{ inputs.bump }}" in
              major) next="$((MA+1)).0.0" ;;
              minor) next="${MA}.$((MI+1)).0" ;;
              patch) next="${MA}.${MI}.$((PA+1))" ;;
            esac
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            # Next rc number for this version.
            n=$(git tag --list "v${next}-rc.*" | wc -l | tr -d ' ')
            next="${next}-rc.$((n+1))"
          fi
          echo "version=$next"      >> "$GITHUB_OUTPUT"
          echo "tag=v$next"         >> "$GITHUB_OUTPUT"
          echo "Releasing v$next (from v$latest)"

      - name: Bump README version reference
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.version }}"
          # Keep the "latest release" example in the README pointing at the new tag.
          if grep -q 'LLAMACLOUDCTL_VERSION.*v[0-9]' README.md; then
            sed -i -E "s#(e\.g\. )\`?v[0-9]+\.[0-9]+\.[0-9]+\`?#\1\`v$ver\`#g" README.md || true
          fi

      - name: Commit docs bump
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No doc changes to commit."
          else
            git add README.md
            git commit -m "docs: release v${{ steps.ver.outputs.version }}"
            git push origin HEAD:main
          fi

  # --- 4 & 5) Human gate, then tag (tag push triggers release.yml) ------------
  tag:
    needs: prepare
    runs-on: ubuntu-latest
    environment: production # ← required-reviewers gate: the "ship to customers?" approval
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create and push the release tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          git tag -a "$TAG" -m "llamacloudctl $TAG"
          git push origin "$TAG"
          echo "Pushed $TAG — release.yml (GoReleaser) will publish the release."
