# Continuous integration: runs on every push to main and every PR.
# Gates merges on formatting, vet, tests, and a full cross-platform build so a
# release tag never fails on something CI could have caught.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The troubleshoot dependency's build-tag contract (see Makefile TAGS):
      # without these, containers/storage compiles its btrfs/devicemapper cgo
      # drivers and fails on missing system headers.
      GOFLAGS: -tags=netgo,containers_image_ostree_stub,exclude_graphdriver_devicemapper,exclude_graphdriver_btrfs,containers_image_openpgp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # Static analysis beyond `go vet`: errcheck, staticcheck, ineffassign, unused,
  # misspell, unconvert (see .golangci.yml). Runs on every PR + push to main.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Track latest so the linter stays new enough to parse the Go toolchain
          # pinned in go.mod; config schema is v2 (see .golangci.yml).
          version: latest

  # Proves every release target still cross-compiles, and that .goreleaser.yaml
  # is valid — without publishing anything.
  build-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk space
        # The six-target cross-compile of the troubleshoot dependency graph
        # overflows the default runner disk (observed: goreleaser ENOSPC at ~29m).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: GoReleaser snapshot (dry-run, no publish)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,publish
