# Source: llamacloud/templates/llamacloud/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "llamacloud"
  namespace: "llamacloud"
  labels:     
    app.kubernetes.io/instance: llamacloud
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: "llamacloud"
  annotations:     
spec:
  replicas: 
  strategy:
    rollingUpdate:
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:       
      app.kubernetes.io/instance: llamacloud
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/name: "llamacloud"
  template:
    metadata:
      labels:         
        app.kubernetes.io/instance: llamacloud
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: "llamacloud"
      annotations:         
    spec:
      imagePullSecrets: 
        []
      serviceAccountName: "llamacloud"
      securityContext:         
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: "llamacloud"
        securityContext:           
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - all
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        image: "docker.io/llamaindex/llamacloud-backend:0.8.5"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        command: 
          - start_platform_api
        livenessProbe:           
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:           
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        startupProbe:           
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 30
        resources:           
          requests:
            cpu: 500m
            memory: 4Gi
          limits:
            cpu: 2
            memory: 6Gi
        env:         
        - name: LOG_LEVEL
          value: INFO
        - name: PORT
          value: "8000"
        - name: UVICORN_PORT
          value: "8000"
        envFrom:         
        - secretRef:
            name: llamacloud-license-key
        - configMapRef:
            name: bucket-config
        - configMapRef:
            name: common-config
        - configMapRef:
            name: extract-config
        - configMapRef:
            name: rate-limits-config
        - configMapRef:
            name: urls-config
        - configMapRef:
            name: temporal-connection-config
        - configMapRef:
            name: feature-config
        - secretRef:
            name: bucket-secret
        - secretRef:
            name: "postgresql-secret"
        - secretRef:
            name: "redis-secret"
        - secretRef:
            name: "basic-auth-secret"
        - secretRef:
            name: "openai-api-key-secret"
        volumeMounts:        
        - mountPath: /tmp
          name: tmp      
      volumes:       
      - emptyDir: {}
        name: tmp
      terminationGracePeriodSeconds: 30

