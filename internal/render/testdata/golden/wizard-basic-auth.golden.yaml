spec:
  backoffLimit: 6
  template:
    metadata:
      labels:         
        app.kubernetes.io/instance: llamacloud
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: temporal-search-attributes-job
    spec:
      restartPolicy: OnFailure
      imagePullSecrets: 
        []
      containers:
      - name: create-search-attributes
        image: "docker.io/temporalio/admin-tools:1.31.0"
        imagePullPolicy: IfNotPresent
        command:
          # Use /bin/sh, not /bin/bash: the configured image
          # (temporalio/admin-tools:1.31.0 by default) ships only busybox sh.
          # The script body below is POSIX-compatible.
          - /bin/sh
          - -c
          - |
            set -e
            TEMPORAL_NAMESPACE="llamacloud"
            MAX_RETRIES=30
            RETRY_INTERVAL=10

            echo "Waiting for Temporal server to be ready..."
            for i in $(seq 1 $MAX_RETRIES); do
              if temporal operator cluster health 2>/dev/null | grep -q SERVING; then
                echo "Temporal server is ready"
                break
              fi
              if [ $i -eq $MAX_RETRIES ]; then
                echo "ERROR: Temporal server not ready after $MAX_RETRIES attempts"
                exit 1
              fi
              echo "Waiting for Temporal server... (attempt $i/$MAX_RETRIES)"
              sleep $RETRY_INTERVAL
            done

            echo "Ensuring Temporal Namespace exists: $TEMPORAL_NAMESPACE"
            for i in $(seq 1 $MAX_RETRIES); do
              # Check if namespace already exists
              if temporal operator namespace describe --namespace "$TEMPORAL_NAMESPACE" >/dev/null 2>&1; then
                echo "Namespace $TEMPORAL_NAMESPACE already exists"
                break
              fi
              # Try to create the namespace
              if temporal operator namespace create --namespace "$TEMPORAL_NAMESPACE" --retention 7d 2>&1; then
                echo "Namespace $TEMPORAL_NAMESPACE created successfully"
                break
              fi
              if [ $i -eq $MAX_RETRIES ]; then
                echo "ERROR: Failed to create namespace after $MAX_RETRIES attempts"
                exit 1
              fi
              echo "Retrying namespace creation... (attempt $i/$MAX_RETRIES)"
              sleep $RETRY_INTERVAL
            done

            echo "Waiting for namespace to be queryable..."
            for i in $(seq 1 30); do
              if temporal operator search-attribute list --namespace "$TEMPORAL_NAMESPACE" >/dev/null 2>&1; then
                echo "Namespace is queryable"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "ERROR: Namespace not queryable after 30 attempts"
                exit 1
              fi
              sleep 1
            done

            echo "Ensuring search attributes exist..."
            echo "Ensuring search attribute exists: Project (Keyword)"
            # Check if attribute already exists
            if temporal operator search-attribute list --namespace "$TEMPORAL_NAMESPACE" 2>/dev/null | grep -q "Project"; then
              echo "Search attribute Project already exists"
            else
              if temporal operator search-attribute create --namespace "$TEMPORAL_NAMESPACE" --name Project --type Keyword 2>&1; then
                echo "Search attribute Project created successfully"
              else
                echo "ERROR: Failed to create search attribute Project"
                exit 1
              fi
            fi
            echo "Ensuring search attribute exists: Organization (Keyword)"
            # Check if attribute already exists
            if temporal operator search-attribute list --namespace "$TEMPORAL_NAMESPACE" 2>/dev/null | grep -q "Organization"; then
              echo "Search attribute Organization already exists"
            else
              if temporal operator search-attribute create --namespace "$TEMPORAL_NAMESPACE" --name Organization --type Keyword 2>&1; then
                echo "Search attribute Organization created successfully"
              else
                echo "ERROR: Failed to create search attribute Organization"
                exit 1
              fi
            fi
            echo "Search attributes setup completed"
        env:
        - name: TEMPORAL_CLI_ADDRESS
          value: "temporal.internal:7233"
        - name: TEMPORAL_ADDRESS
          value: "temporal.internal:7233"
