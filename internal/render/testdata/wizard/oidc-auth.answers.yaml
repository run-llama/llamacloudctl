# Scripted answers for a full guided-wizard run with OIDC auth, keyed by prompt
# title. Same substrate as basic-auth.answers.yaml but exercises the OIDC path —
# the mapping that was buggy before this pass (wrote `issuer` instead of
# `discoveryUrl` and never set `enabled`). Consumed by the wizard-driven render
# profile. The rendered OIDC secret contains a randAlphaNum SESSION_SECRET_KEY,
# which the harness normalizes before golden comparison (see render.go).
